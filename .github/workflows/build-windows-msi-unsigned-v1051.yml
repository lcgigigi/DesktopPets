name: Build Windows diagnostic MSI v1.0.51 raw auth capture

on:
  push:
    branches:
      - codex/p0-auth-callback-diagnostics-1.0.51

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-enterprise-msi-unsigned-v1051
  cancel-in-progress: false

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize durable QA evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\windows-deployment-smoke -Force | Out-Null
          [ordered]@{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            runner = '${{ runner.name }}'
            startedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\artifacts\windows-deployment-smoke\workflow-run.json `
            -Encoding UTF8

      - name: Compile visual gate with PowerShell 7
        shell: pwsh
        run: |
          & .\scripts\windows-msi\Test-HualiAIWindowsVisualSmoke.ps1 -CompileBackdropOnly
          foreach ($gate in @(
            '.\scripts\windows-msi\Test-HualiAIMsi.ps1',
            '.\scripts\windows-msi\Test-HualiAISilentDeployment.ps1'
          )) {
            [scriptblock]::Create((Get-Content -LiteralPath $gate -Raw)) | Out-Null
          }

      - name: Compile visual gate with Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\scripts\windows-msi\Test-HualiAIWindowsVisualSmoke.ps1 -CompileBackdropOnly
          foreach ($gate in @(
            '.\scripts\windows-msi\Test-HualiAIMsi.ps1',
            '.\scripts\windows-msi\Test-HualiAISilentDeployment.ps1'
          )) {
            [scriptblock]::Create((Get-Content -LiteralPath $gate -Raw)) | Out-Null
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust MSVC
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add rustfmt clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused raw-auth diagnostic tests
        run: >-
          npm test -- --run
          src/services/desktop-auth.service.test.ts
          src/services/diagnostic.service.test.ts
          src/utils/windows-deployment-script-contract.test.ts

      - name: Build production frontend
        run: npm run build:prod

      - name: Check native formatting
        run: cargo fmt --manifest-path .\src-tauri\Cargo.toml -- --check

      - name: Run focused native raw-auth diagnostic tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path .\src-tauri\Cargo.toml diagnostic_fields_
          cargo test --locked --manifest-path .\src-tauri\Cargo.toml native_callback_diagnostics_preserve_the_prefix_remainder_and_raw_values

      - name: Build and validate unsigned intranet enterprise MSI
        shell: pwsh
        run: |
          & .\scripts\build-windows-msi.ps1 -Mode intranet -AllowUnsigned -SkipNpmCi

      - name: Download pinned v1.0.50 upgrade baseline
        uses: actions/download-artifact@v6
        with:
          name: huali-windows-enterprise-msi-intranet-v1.0.50
          path: artifacts/previous-release
          github-token: ${{ github.token }}
          run-id: 33462120167

      - name: Verify pinned v1.0.50 upgrade baseline
        shell: pwsh
        run: |
          $expectedHash = 'ddecb14d99c2810a00cdcf90d708a8b5eb076d2fa877cbaad8d6c597dc77f368'
          $oldMsi = @(Get-ChildItem .\artifacts\previous-release -Recurse -File -Filter '*.msi')
          if ($oldMsi.Count -ne 1) {
            throw "Pinned v1.0.50 artifact must contain exactly one MSI; found $($oldMsi.Count)."
          }
          $actualHash = (Get-FileHash -LiteralPath $oldMsi[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            sourceRunId = '33462120167'
            artifact = 'huali-windows-enterprise-msi-intranet-v1.0.50'
            path = $oldMsi[0].FullName
            expectedSha256 = $expectedHash
            actualSha256 = $actualHash
            verifiedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\artifacts\windows-deployment-smoke\previous-msi.json `
            -Encoding UTF8
          if ($actualHash -ne $expectedHash) {
            throw "Pinned v1.0.50 MSI SHA256 mismatch: actual=$actualHash expected=$expectedHash."
          }
          "HUALI_PREVIOUS_MSI=$($oldMsi[0].FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify administrator upgrade and raw protocol callback capture
        shell: pwsh
        run: |
          $msi = Get-ChildItem .\artifacts\windows-msi-intranet\*.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI artifact was not found.' }
          & .\scripts\windows-msi\Test-HualiAISilentDeployment.ps1 `
            -MsiPath $msi.FullName `
            -ExpectedVersion '1.0.51' `
            -PreviousMsiPath $env:HUALI_PREVIOUS_MSI `
            -PreviousVersion '1.0.50' `
            -PreviousMsiSha256 'ddecb14d99c2810a00cdcf90d708a8b5eb076d2fa877cbaad8d6c597dc77f368' `
            -RequireRawAuthDiagnostics `
            -EvidenceDirectory .\artifacts\windows-deployment-smoke

      - name: Finalize QA evidence even after failure
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\windows-deployment-smoke -Force | Out-Null
          [ordered]@{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            jobStatusBeforeEvidenceUpload = '${{ job.status }}'
            completedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\artifacts\windows-deployment-smoke\workflow-final-state.json `
            -Encoding UTF8

      - name: Upload administrator distribution package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: huali-windows-enterprise-msi-intranet-v1.0.51
          path: |
            artifacts/windows-msi-intranet/
            artifacts/*-intranet-windows-enterprise-msi-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Always upload deployment QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: huali-windows-qa-evidence-v1.0.51-${{ github.run_id }}
          path: artifacts/windows-deployment-smoke/
          if-no-files-found: warn
          retention-days: 30
