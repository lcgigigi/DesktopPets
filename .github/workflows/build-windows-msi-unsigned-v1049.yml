name: Build unsigned Windows enterprise MSI v1.0.49

on:
  push:
    branches:
      - codex/p0-auth-notification-1.0.49

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-enterprise-msi-unsigned-v1049
  cancel-in-progress: false

jobs:
  build-msi:
    runs-on: windows-latest
    timeout-minutes: 80

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Initialize durable QA evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\windows-deployment-smoke -Force | Out-Null
          [ordered]@{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            runner = '${{ runner.name }}'
            startedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\artifacts\windows-deployment-smoke\workflow-run.json `
            -Encoding UTF8

      - name: Compile visual gate with PowerShell 7
        shell: pwsh
        run: |
          & .\scripts\windows-msi\Test-HualiAIWindowsVisualSmoke.ps1 -CompileBackdropOnly
          foreach ($gate in @(
            '.\scripts\windows-msi\Test-HualiAIMsi.ps1',
            '.\scripts\windows-msi\Test-HualiAISilentDeployment.ps1'
          )) {
            [scriptblock]::Create((Get-Content -LiteralPath $gate -Raw)) | Out-Null
          }

      - name: Compile visual gate with Windows PowerShell 5.1
        shell: powershell
        run: |
          & .\scripts\windows-msi\Test-HualiAIWindowsVisualSmoke.ps1 -CompileBackdropOnly
          foreach ($gate in @(
            '.\scripts\windows-msi\Test-HualiAIMsi.ps1',
            '.\scripts\windows-msi\Test-HualiAISilentDeployment.ps1'
          )) {
            [scriptblock]::Create((Get-Content -LiteralPath $gate -Raw)) | Out-Null
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up stable Rust MSVC
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
          rustup default stable-x86_64-pc-windows-msvc
          rustup component add rustfmt clippy

      - name: Install locked dependencies
        run: npm ci

      - name: Run frontend regression tests
        run: npm test

      - name: Build production frontend
        run: npm run build:prod

      - name: Check native formatting
        run: cargo fmt --manifest-path .\src-tauri\Cargo.toml -- --check

      - name: Run Windows native regression tests
        run: cargo test --locked --manifest-path .\src-tauri\Cargo.toml

      - name: Reject Windows native warnings
        run: cargo clippy --locked --manifest-path .\src-tauri\Cargo.toml -- -D warnings

      - name: Build and validate unsigned intranet enterprise MSI
        shell: pwsh
        run: |
          & .\scripts\build-windows-msi.ps1 -Mode intranet -AllowUnsigned -SkipNpmCi

      - name: Download pinned v1.0.48 upgrade baseline
        uses: actions/download-artifact@v6
        with:
          name: huali-windows-enterprise-msi-intranet-v1.0.48
          path: artifacts/previous-release
          github-token: ${{ github.token }}
          run-id: 33363575799

      - name: Verify pinned v1.0.48 upgrade baseline
        shell: pwsh
        run: |
          $expectedHash = 'f8cbec3e2ff09bba1f8480b8dc630abbeead16243b2c9ca2b7d835ee295acf98'
          $oldMsi = @(Get-ChildItem .\artifacts\previous-release -Recurse -File -Filter '*.msi')
          if ($oldMsi.Count -ne 1) {
            throw "Pinned v1.0.48 artifact must contain exactly one MSI; found $($oldMsi.Count)."
          }
          $actualHash = (Get-FileHash -LiteralPath $oldMsi[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            sourceRunId = '33363575799'
            artifact = 'huali-windows-enterprise-msi-intranet-v1.0.48'
            path = $oldMsi[0].FullName
            expectedSha256 = $expectedHash
            actualSha256 = $actualHash
            verifiedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\artifacts\windows-deployment-smoke\previous-msi.json `
            -Encoding UTF8
          if ($actualHash -ne $expectedHash) {
            throw "Pinned v1.0.48 MSI SHA256 mismatch: actual=$actualHash expected=$expectedHash."
          }
          "HUALI_PREVIOUS_MSI=$($oldMsi[0].FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke-test administrator deployment, upgrade, and live HWND interaction
        shell: pwsh
        run: |
          $msi = Get-ChildItem .\artifacts\windows-msi-intranet\*.msi | Select-Object -First 1
          if (-not $msi) { throw 'MSI artifact was not found.' }
          & .\scripts\windows-msi\Test-HualiAISilentDeployment.ps1 `
            -MsiPath $msi.FullName `
            -ExpectedVersion '1.0.49' `
            -PreviousMsiPath $env:HUALI_PREVIOUS_MSI `
            -PreviousVersion '1.0.48' `
            -PreviousMsiSha256 'f8cbec3e2ff09bba1f8480b8dc630abbeead16243b2c9ca2b7d835ee295acf98' `
            -ValidateDefaultLaunch `
            -RunVisualSmoke `
            -EvidenceDirectory .\artifacts\windows-deployment-smoke

      - name: Record default-launch coverage
        if: success()
        shell: pwsh
        run: |
          $report = Get-Content `
            -LiteralPath .\artifacts\windows-deployment-smoke\deployment-smoke-report.json `
            -Raw | ConvertFrom-Json
          $defaultLaunch = $report.checks.defaultLaunch
          if (-not $defaultLaunch) {
            throw 'Deployment report is missing the default-launch gate.'
          }
          if ($defaultLaunch.manualInteractiveGateRequired) {
            @(
              '## Windows default-launch coverage'
              ''
              '⚠️ Hosted runner has no Explorer session. No-user fallback, HKLM Run fallback, and no-spurious-process behavior passed; interactive launch remains a physical Windows gate.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          } else {
            @(
              '## Windows default-launch coverage'
              ''
              '✅ Interactive post-install launch, exact executable, process session, and visible window passed.'
            ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }

      - name: Finalize QA evidence even after failure
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifacts\windows-deployment-smoke -Force | Out-Null
          [ordered]@{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            runId = '${{ github.run_id }}'
            jobStatusBeforeEvidenceUpload = '${{ job.status }}'
            completedAt = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content `
            -LiteralPath .\artifacts\windows-deployment-smoke\workflow-final-state.json `
            -Encoding UTF8

      - name: Upload administrator distribution package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: huali-windows-enterprise-msi-intranet-v1.0.49
          path: |
            artifacts/windows-msi-intranet/
            artifacts/*-intranet-windows-enterprise-msi-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Always upload deployment QA evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: huali-windows-qa-evidence-v1.0.49-${{ github.run_id }}
          path: artifacts/windows-deployment-smoke/
          if-no-files-found: warn
          retention-days: 30
